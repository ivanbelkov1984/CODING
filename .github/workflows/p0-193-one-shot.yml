name: P0 193 one-shot source patch

on:
  push:
    branches: [MAIN]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'P0: make Anthropic structured schemas provider-compatible (#193)' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MAIN
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: architect/package-lock.json

      - name: Apply guarded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('architect/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_schema = "conf: { type: 'integer', minimum: 0, maximum: 100 },"
          new_schema = "conf: { type: 'integer' },"
          if app.count(old_schema) != 1:
              raise SystemExit(f'P0-193 guard: expected exactly 1 psych confidence schema, found {app.count(old_schema)}')
          app = app.replace(old_schema, new_schema, 1)

          old_parse = """  const out = JSON.parse(text);\n  let n = 0;\n  (out.items || []).forEach(m => {"""
          new_parse = """  const out = JSON.parse(text);\n  const psyItems = Array.isArray(out.items) ? out.items : [];\n  if (psyItems.some(m => !m || !Number.isInteger(m.id) || !Number.isInteger(m.conf) || m.conf < 0 || m.conf > 100))\n    throw new Error('Некорректная разметка психоконтура: confidence должен быть целым числом 0–100');\n  let n = 0;\n  psyItems.forEach(m => {"""
          if app.count(old_parse) != 1:
              raise SystemExit(f'P0-193 guard: expected exactly 1 psych parse block, found {app.count(old_parse)}')
          app = app.replace(old_parse, new_parse, 1)
          app_path.write_text(app, encoding='utf-8')

          triage_path = Path('architect/backend/triage.mjs')
          triage = triage_path.read_text(encoding='utf-8')
          old_triage_schema = "confidence:{type:'integer', minimum:0, maximum:100},"
          new_triage_schema = "confidence:{type:'integer'},"
          if triage.count(old_triage_schema) != 1:
              raise SystemExit(f'P0-193 guard: expected exactly 1 triage confidence schema, found {triage.count(old_triage_schema)}')
          triage = triage.replace(old_triage_schema, new_triage_schema, 1)
          old_triage_parse = "const out = JSON.parse(data.content.filter(b => b.type==='text').map(b => b.text).join(''));\n\nfor (const m of out.items) {"
          new_triage_parse = "const out = JSON.parse(data.content.filter(b => b.type==='text').map(b => b.text).join(''));\nif (!out || !Array.isArray(out.items) || out.items.some(m => !m || !Number.isInteger(m.confidence) || m.confidence < 0 || m.confidence > 100)) {\n  console.error('Claude API: invalid structured triage output (confidence must be integer 0..100)');\n  await pool.end();\n  process.exit(1);\n}\n\nfor (const m of out.items) {"
          if triage.count(old_triage_parse) != 1:
              raise SystemExit(f'P0-193 guard: expected exactly 1 triage parse block, found {triage.count(old_triage_parse)}')
          triage = triage.replace(old_triage_parse, new_triage_parse, 1)
          triage_path.write_text(triage, encoding='utf-8')

          test_path = Path('architect/tests/p0-193-anthropic-schema.spec.mjs')
          test_path.write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\n\nconst app = fs.readFileSync(new URL('../app.js', import.meta.url), 'utf8');\nconst triage = fs.readFileSync(new URL('../backend/triage.mjs', import.meta.url), 'utf8');\n\nassert.ok(!app.includes(\"conf: { type: 'integer', minimum: 0, maximum: 100 }\"), 'psych contour: Anthropic transport schema must not carry integer bounds');\nassert.match(app, /Number\\.isInteger\\(m\\.conf\\).*m\\.conf < 0 \\|\\| m\\.conf > 100/s, 'psych contour: domain confidence validation 0..100 must remain');\nassert.ok(!triage.includes(\"confidence:{type:'integer', minimum:0, maximum:100}\"), 'triage: Anthropic transport schema must not carry integer bounds');\nassert.match(triage, /Number\\.isInteger\\(m\\.confidence\\).*m\\.confidence < 0 \\|\\| m\\.confidence > 100/s, 'triage: domain confidence validation 0..100 must remain');\n\n// Guard the two direct Anthropic structured-output call sites known in MAIN.\nfor (const [name, source] of [['app', app], ['triage', triage]]) {\n  const directIntegerBounds = /type:\\s*['\"]integer['\"][^}\\n]*(?:minimum|maximum)/g;\n  assert.equal((source.match(directIntegerBounds) || []).length, 0, `${name}: unsupported integer bounds must not reach Anthropic structured-output schemas`);\n}\n\nconsole.log('P0-193 Anthropic schema regression: 6/6');\n""", encoding='utf-8')

          pkg_path = Path('architect/package.json')
          pkg = pkg_path.read_text(encoding='utf-8')
          needle = '"test": "node build.mjs --combined dist/app.html && '
          replacement = '"test": "node build.mjs --combined dist/app.html && node tests/p0-193-anthropic-schema.spec.mjs && '
          if pkg.count(needle) != 1:
              raise SystemExit(f'P0-193 guard: expected package test prefix once, found {pkg.count(needle)}')
          pkg = pkg.replace(needle, replacement, 1)
          pkg_path.write_text(pkg, encoding='utf-8')

          handoff = Path('STUDIO_HANDOFF.md')
          marker = 'P0 #193 — совместимость Anthropic structured-output schema'
          text = handoff.read_text(encoding='utf-8')
          if marker not in text:
              text += """\n\n### 2026-09-01 13:50 UTC · сессия: CODING · P0 #193 — совместимость Anthropic structured-output schema\nКоммиты: этот hotfix-коммит.\nСостояние: production-ошибка психоконтура `Claude 400: integer minimum/maximum are not supported` исправлена на уровне provider transport schema; числовая граница confidence 0..100 сохранена как детерминированная application validation. Тот же класс исправлен в backend triage. Sync не менялся: AI-ошибка остаётся отдельной от уже успешного GET/PUT/sync. Добавлен regression guard в `npm test`.\nДальше: после зелёного CI/deploy на MAIN подтвердить на owner-device, что психоконтур больше не получает Claude 400; consumer-подписка Claude для этого API-вызова не требуется.\n"""
              handoff.write_text(text, encoding='utf-8')
          PY

      - name: Focused regression and lint
        working-directory: architect
        run: |
          npm ci
          node tests/p0-193-anthropic-schema.spec.mjs
          npm run lint
          npm run build

      - name: Commit guarded hotfix to MAIN
        shell: bash
        run: |
          git config user.name "P0 Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add architect/app.js architect/backend/triage.mjs architect/tests/p0-193-anthropic-schema.spec.mjs architect/package.json STUDIO_HANDOFF.md
          if git diff --cached --quiet; then
            echo "No patch needed; source already fixed."
            exit 0
          fi
          git commit -m "P0: make Anthropic structured schemas provider-compatible (#193)"
          git push origin HEAD:MAIN
