name: Temporary P1-C WebKit sheet hardening

on:
  push:
    branches:
      - agent/phase-1-privacy-feedback-boundaries
    paths:
      - architect/scripts/fix-p1c-webkit-sheet.mjs
      - .github/workflows/tmp-p1c-webkit-sheet.yml
  pull_request:
    paths:
      - architect/scripts/fix-p1c-webkit-sheet.mjs
      - .github/workflows/tmp-p1c-webkit-sheet.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-privacy-feedback-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply deterministic sheet state
        working-directory: architect
        run: node scripts/fix-p1c-webkit-sheet.mjs
      - name: Install dependencies
        working-directory: architect
        run: npm install
      - name: Install Chromium
        working-directory: architect
        run: npx playwright install --with-deps chromium
      - name: Validate focused and full web suite
        working-directory: architect
        run: |
          node --check tests/mobile-evidence.mjs
          node tests/evidence/privacy_feedback_regression.mjs
          npm test
          git diff --check
      - name: Commit verified hardening
        working-directory: architect
        run: |
          git config user.name 'p1c-privacy-bot'
          git config user.email 'p1c-privacy@architect.app'
          git add styles.css tests/mobile-evidence.mjs tests/evidence/privacy_feedback_regression.mjs
          git commit -m 'fix(mobile): keep feedback sheets visibly rendered'
          git push origin HEAD:agent/phase-1-privacy-feedback-boundaries
