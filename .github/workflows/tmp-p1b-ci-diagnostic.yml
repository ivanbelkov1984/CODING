name: Temporary P1-B full CI diagnostic

on:
  push:
    branches:
      - agent/phase-1-ai-policy-validators
  pull_request:
    paths:
      - architect/**
      - .github/workflows/tmp-p1b-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: architect
        run: npm install
      - name: Install Chromium
        working-directory: architect
        run: npx playwright install --with-deps chromium
      - name: Capture npm test
        id: test
        working-directory: architect
        shell: bash
        run: |
          mkdir -p test-results/p1b-ci
          set +e
          npm test > test-results/p1b-ci/npm-test.log 2>&1
          status=$?
          cat test-results/p1b-ci/npm-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload full diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p1b-full-ci-diagnostic
          path: architect/test-results/p1b-ci/npm-test.log
          retention-days: 1
      - name: Fail if npm test failed
        if: steps.test.outputs.status != '0'
        run: exit 1
