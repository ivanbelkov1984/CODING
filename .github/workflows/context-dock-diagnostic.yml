name: Context dock diagnostic

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/context-dock-diagnostic.yml"

jobs:
  focused-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run focused test and capture log
        id: test
        shell: bash
        run: |
          set +e
          node build.mjs --combined dist/app.html > context-dock.log 2>&1
          node tests/context-action-dock.test.mjs >> context-dock.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: context-dock-test-log
          path: architect/context-dock.log
          if-no-files-found: error
      - name: Fail after artifact upload
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
