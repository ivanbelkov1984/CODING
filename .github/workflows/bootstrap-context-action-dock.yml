name: Bootstrap context action dock

on:
  push:
    branches:
      - agent/context-action-dock

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-action-dock
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: architect/package-lock.json

      - name: Apply issue 138
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique: {label} ({text.count(old)})')
              return text.replace(old, new, 1)

          app_path = Path('architect/app.js')
          app = app_path.read_text()

          context_js = r'''
// ── Context action dock (issue #138) ─────────────────────────────
// Глобальный FAB остаётся «Записать». Эта панель даёт только действия
// текущего раздела и вызывает существующие формы/handlers без новой логики.
const NSH_CONTEXT_ACTIONS = {
  'map:insights': [
    { id:'insight', label:'Новый инсайт', icon:'plus', primary:true, run:() => openOv('ov-add') },
  ],
  'map:dreams': [
    { id:'dream', label:'Записать сон', icon:'moon', primary:true, run:() => openOv('ov-drm') },
  ],
  'map:patterns': [
    { id:'pattern', label:'Новый паттерн', icon:'git-branch', primary:true, run:() => openOv('ov-pat-add') },
  ],
  'map:spiritual': [
    { id:'spiritual', label:'Новая запись', icon:'sparkles', primary:true, run:() => openOv('ov-spi-add') },
  ],
  'map:evolution': [
    { id:'evolution', label:'Новая запись', icon:'trending-up', primary:true, run:() => openOv('ov-evo-add') },
  ],
  vit: [
    { id:'sphere-log', label:'Отметить сферу', icon:'check-circle-2', primary:true, run:() => captureSphere() },
    { id:'sphere-new', label:'Новая сфера', icon:'plus', run:() => openSphereEdit() },
  ],
  health: [
    { id:'symptom', label:'Симптом', icon:'heart-pulse', primary:true, run:() => openOv('ov-symptom') },
    { id:'measure', label:'Измерение', icon:'activity', run:() => openOv('ov-measure') },
    { id:'craving', label:'Тяга', icon:'flame', run:() => openOv('ov-craving') },
  ],
  sys: [
    { id:'digest', label:'Обзор недели', icon:'refresh-cw', primary:true, run:() => mkDig() },
    { id:'doctor', label:'Отчёт врачу', icon:'file-text', run:() => openDoctorReport() },
  ],
  'astro:natal': [
    { id:'wheel', label:'Колесо карты', icon:'maximize-2', primary:true, run:() => openFullWheel() },
  ],
};
function nshContextKey() {
  const pg = document.querySelector('.pg.on');
  if (!pg) return '';
  const tab = pg.id.replace('pg-', '');
  if (tab === 'map') {
    const sub = [...document.querySelectorAll('#pg-map [id^="ms-"]')]
      .find(el => getComputedStyle(el).display !== 'none');
    return 'map:' + (sub ? sub.id.slice(3) : 'insights');
  }
  if (tab === 'astro') {
    const sub = [...document.querySelectorAll('#pg-astro .asub')]
      .find(el => getComputedStyle(el).display !== 'none');
    return 'astro:' + (sub ? sub.id.replace('as-', '') : 'menu');
  }
  return tab;
}
function nshContextActions() { return NSH_CONTEXT_ACTIONS[nshContextKey()] || []; }
function nshRunContextAction(id) {
  const act = nshContextActions().find(a => a.id === id);
  if (act && typeof act.run === 'function') act.run();
}
let _nshContextBound = false, _nshContextFrame = 0;
function nshScheduleContextDock() {
  if (_nshContextFrame) cancelAnimationFrame(_nshContextFrame);
  _nshContextFrame = requestAnimationFrame(() => { _nshContextFrame = 0; nshUpdateContextDock(); });
}
function nshUpdateContextDock() {
  const dock = $('nsh-context-dock'); if (!dock) return;
  const phone = !!(window.matchMedia && matchMedia('(max-width:767px)').matches);
  const unobstructed = !document.querySelector('.ov.on');
  const actions = (navShellEnabled() && phone && unobstructed) ? nshContextActions() : [];
  document.body.classList.toggle('nsh-context-on', actions.length > 0);
  dock.hidden = actions.length === 0;
  dock.innerHTML = actions.map(a =>
    `<button type="button" class="nsh-context-action${a.primary ? ' primary' : ''}" onclick="nshRunContextAction('${a.id}')" aria-label="${esc(a.label)}"><i data-lucide="${a.icon}"></i><span>${esc(a.label)}</span></button>`
  ).join('');
  if (actions.length) icons();
}
function nshBindContextDock() {
  if (_nshContextBound) return; _nshContextBound = true;
  const obs = new MutationObserver(nshScheduleContextDock);
  obs.observe(document.body, { subtree:true, attributes:true, attributeFilter:['class','style'] });
  window.addEventListener('hashchange', nshScheduleContextDock);
  window.addEventListener('resize', nshScheduleContextDock);
}

'''
          app = replace_once(app,
              "// ── Hash-роутинг v2 (аддитивно; только при navshell) ────────────",
              context_js + "// ── Hash-роутинг v2 (аддитивно; только при navshell) ────────────",
              'app context insertion')
          app = replace_once(app,
              "  nshSidebarGroups(on);\n  if (on) {",
              "  nshSidebarGroups(on);\n  nshBindContextDock();\n  nshUpdateContextDock();\n  if (on) {",
              'applyNavShell dock update')
          app_path.write_text(app)

          index_path = Path('architect/index.html')
          index = index_path.read_text()
          dock_html = '''<!-- Контекстные действия текущего раздела; только nav shell/iPhone -->
<div class="nsh-context-dock" id="nsh-context-dock" role="toolbar" aria-label="Действия текущего раздела" hidden></div>

'''
          index = replace_once(index,
              '<!-- ══ NAVIGATION SHELL v2 (за флагом arch_nav_v2; скрыто без body.navshell) ══ -->',
              dock_html + '<!-- ══ NAVIGATION SHELL v2 (за флагом arch_nav_v2; скрыто без body.navshell) ══ -->',
              'index dock markup')
          index_path.write_text(index)

          styles_path = Path('architect/styles.css')
          styles = styles_path.read_text()
          context_css = r'''

/* Context action dock — действия текущего раздела, отдельные от глобального FAB */
.nsh-context-dock{display:none}
@media(max-width:767px){
  body.navshell .nsh-context-dock:not([hidden]){display:flex;position:fixed;z-index:57;left:50%;transform:translateX(-50%);
    bottom:calc(66px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px);min-height:52px;
    align-items:stretch;gap:6px;padding:6px;background:var(--sf);border:1px solid var(--bd2);
    border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.28);backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);overflow-x:auto;overscroll-behavior-x:contain}
  body.navshell .nsh-context-action{display:flex;align-items:center;justify-content:center;gap:6px;flex:1 0 auto;
    min-width:44px;min-height:44px;padding:0 11px;border-radius:12px;background:var(--bg2);color:var(--t2);
    font:inherit;font-size:.76rem;font-weight:650;white-space:nowrap;border:1px solid transparent}
  body.navshell .nsh-context-action.primary{background:var(--blue-btn);color:#fff}
  body.navshell .nsh-context-action svg{width:17px;height:17px;flex:none}
  body.navshell .nsh-context-action:active{transform:scale(.98)}
  body.navshell .nsh-context-action:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  body.navshell.nsh-context-on .content{padding-bottom:126px}
}
@media(prefers-reduced-motion:reduce){body.navshell .nsh-context-action:active{transform:none}}
'''
          if 'Context action dock — действия текущего раздела' in styles:
              raise SystemExit('context CSS already present')
          styles_path.write_text(styles.rstrip() + context_css + '\n')

          test_path = Path('architect/tests/e2e.mjs')
          tests = test_path.read_text()
          context_tests = r'''
// ── Issue #138: контекстный action dock текущего раздела ──
const dockT = await page.evaluate(() => {
  const r = {};
  const dock = document.getElementById('nsh-context-dock');
  const labels = () => [...dock.querySelectorAll('button')].map(b => b.getAttribute('aria-label'));
  localStorage.setItem('arch_nav_v2', '0'); applyNavShell(); nshUpdateContextDock();
  r.offHidden = dock.hidden && !document.body.classList.contains('nsh-context-on');
  localStorage.setItem('arch_nav_v2', '1'); applyNavShell();

  goTo('home'); nshUpdateContextDock(); r.todayHidden = dock.hidden;
  goTo('map'); msub('insights'); nshUpdateContextDock();
  r.insight = !dock.hidden && labels().join('|') === 'Новый инсайт';
  nshRunContextAction('insight'); r.insightOpen = document.getElementById('ov-add').classList.contains('on'); closeOv('ov-add');

  msub('dreams'); nshUpdateContextDock(); r.dream = labels().includes('Записать сон');
  nshRunContextAction('dream'); r.dreamOpen = document.getElementById('ov-drm').classList.contains('on'); closeOv('ov-drm');
  msub('patterns'); nshUpdateContextDock(); r.pattern = labels().includes('Новый паттерн');
  nshRunContextAction('pattern'); r.patternOpen = document.getElementById('ov-pat-add').classList.contains('on'); closeOv('ov-pat-add');
  msub('spiritual'); nshUpdateContextDock(); r.spiritual = labels().includes('Новая запись');
  nshRunContextAction('spiritual'); r.spiritualOpen = document.getElementById('ov-spi-add').classList.contains('on'); closeOv('ov-spi-add');
  msub('evolution'); nshUpdateContextDock(); r.evolution = labels().includes('Новая запись');
  nshRunContextAction('evolution'); r.evolutionOpen = document.getElementById('ov-evo-add').classList.contains('on'); closeOv('ov-evo-add');

  goTo('vit'); nshUpdateContextDock(); r.spheres = labels().join('|') === 'Отметить сферу|Новая сфера';
  const oldSpheres = DB.spheres; DB.spheres = [{id:7101,name:'Первая'},{id:7102,name:'Вторая'}];
  nshRunContextAction('sphere-log');
  r.spherePick = document.getElementById('ov-sphere-pick').classList.contains('on') && document.querySelectorAll('#sphere-pick-list button').length === 2;
  closeOv('ov-sphere-pick'); DB.spheres = oldSpheres;

  goTo('health'); nshUpdateContextDock(); r.health = labels().join('|') === 'Симптом|Измерение|Тяга';
  nshRunContextAction('symptom'); r.symptomOpen = document.getElementById('ov-symptom').classList.contains('on'); closeOv('ov-symptom');
  nshRunContextAction('measure'); r.measureOpen = document.getElementById('ov-measure').classList.contains('on'); closeOv('ov-measure');
  nshRunContextAction('craving'); r.cravingOpen = document.getElementById('ov-craving').classList.contains('on'); closeOv('ov-craving');

  goTo('sys'); nshUpdateContextDock(); r.overview = labels().join('|') === 'Обзор недели|Отчёт врачу';
  const before = (DB.digests || []).length; nshRunContextAction('digest'); r.digest = (DB.digests || []).length === before + 1;
  nshRunContextAction('doctor'); r.doctorOpen = document.getElementById('ov-doc-report').classList.contains('on'); closeOv('ov-doc-report');

  goTo('settings'); nshUpdateContextDock(); r.settingsHidden = dock.hidden;
  goTo('map'); msub('dreams'); nshUpdateContextDock();
  const buttons = [...dock.querySelectorAll('button')];
  r.semantic = buttons.length === 1 && buttons.every(b => b.tagName === 'BUTTON' && b.type === 'button' && !!b.getAttribute('aria-label'));
  r.tap = buttons.every(b => { const x=b.getBoundingClientRect(); return x.width >= 44 && x.height >= 44; });
  openOv('ov-search'); nshUpdateContextDock(); r.overlayHidden = dock.hidden; closeOv('ov-search');
  goTo('home');
  return r;
});
ok(dockT.offHidden && dockT.todayHidden && dockT.settingsHidden, 'action dock: OFF/Сегодня/Настройки — панель скрыта');
ok(dockT.insight && dockT.insightOpen && dockT.dream && dockT.dreamOpen, 'action dock: Дневник → Инсайты/Сны открывают правильные существующие формы');
ok(dockT.pattern && dockT.patternOpen && dockT.spiritual && dockT.spiritualOpen && dockT.evolution && dockT.evolutionOpen, 'action dock: Паттерны/Духовное/Эволюция маршрутизируются без новой бизнес-логики');
ok(dockT.spheres && dockT.spherePick, 'action dock: Сферы → отметить/создать; при N сферах требуется явный выбор');
ok(dockT.health && dockT.symptomOpen && dockT.measureOpen && dockT.cravingOpen, 'action dock: Здоровье → Симптом/Измерение/Тяга');
ok(dockT.overview && dockT.digest && dockT.doctorOpen, 'action dock: Обзор → собрать неделю/отчёт врачу');
ok(dockT.semantic && dockT.tap && dockT.overlayHidden, 'action dock a11y: button, имена, ≥44px; при overlay скрывается');

'''
          tests = replace_once(tests,
              '// Вьюпорты: iPhone SE / std / Pro Max — таб-бар; iPad portrait — сгруппированный sidebar.',
              context_tests + '// Вьюпорты: iPhone SE / std / Pro Max — таб-бар; iPad portrait — сгруппированный sidebar.',
              'e2e context tests')
          test_path.write_text(tests)

          Path('.github/workflows/bootstrap-context-action-dock.yml').unlink()
          PY

      - name: Install and validate static checks
        working-directory: architect
        run: |
          npm ci
          npm run lint
          npm run build:test

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architect/app.js architect/index.html architect/styles.css architect/tests/e2e.mjs .github/workflows/bootstrap-context-action-dock.yml
          git commit -m "add contextual action dock"
          git push origin HEAD:agent/context-action-dock
