name: Current merge diagnostic

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/current-merge-diagnostic.yml"

jobs:
  npm-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture npm test
        id: test
        shell: bash
        run: |
          set +e
          npm test > current-merge.log 2>&1
          code=$?
          tail -120 current-merge.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: current-merge-test-log
          path: architect/current-merge.log
          if-no-files-found: error
      - name: Preserve failure
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
