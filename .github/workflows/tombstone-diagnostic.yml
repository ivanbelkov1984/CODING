name: Temporary tombstone regression diagnostic

on:
  pull_request:
    paths:
      - architect/app.js
      - architect/package.json
      - architect/tests/evidence/tombstone_namespacing_regression.mjs
      - .github/workflows/tombstone-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused regression and capture output
        working-directory: architect
        shell: bash
        run: |
          set +e
          npm run test:data > tombstone-test-output.txt 2>&1
          code=$?
          cat tombstone-test-output.txt
          echo "$code" > tombstone-test-exit-code.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tombstone-regression-diagnostic
          path: |
            architect/tombstone-test-output.txt
            architect/tombstone-test-exit-code.txt
          if-no-files-found: error
