name: CI — Архитектор

# Регрессионная сеть: собирает приложение и гоняет E2E в Chromium
# на каждый push/PR. Защищает курс после инцидента с потерей данных.

on:
  push:
    branches: [ MAIN, "claude/**", "studio/**" ]
    paths: [ "architect/**" ]
  pull_request:
    paths: [ "architect/**" ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Быстрый синтаксический линт до тяжёлого Chromium: битый JS роняет CI
      # за секунды, не тратя минуты на установку браузера и прогон E2E.
      - name: Lint (syntax)
        run: |
          for f in build.mjs tests/e2e.mjs sw.js app.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Install deps
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build + E2E
        run: npm test
