name: Temporary P1-A exact wiring

on:
  push:
    branches:
      - agent/phase-1-additive-schema-metadata
    paths:
      - architect/scripts/apply-p1a-wiring.mjs
      - .github/workflows/tmp-p1a-apply.yml
  pull_request:
    paths:
      - architect/scripts/apply-p1a-wiring.mjs
      - .github/workflows/tmp-p1a-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-additive-schema-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact P1-A wiring
        working-directory: architect
        run: node scripts/apply-p1a-wiring.mjs
      - name: Validate focused adapter and commit
        working-directory: architect
        run: |
          node --check data-metadata.js
          node --check app.js
          node tests/evidence/additive_schema_metadata_regression.mjs
          git diff --check
          git config user.name 'p1a-metadata-bot'
          git config user.email 'p1a-metadata@architect.app'
          git add app.js index.html build.mjs package.json tests/evidence/additive_schema_metadata_regression.mjs
          git commit -m 'feat(data): wire additive record metadata boundaries'
          git push origin HEAD:agent/phase-1-additive-schema-metadata
