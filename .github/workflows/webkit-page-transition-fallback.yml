name: Temporary WebKit page transition fallback

on:
  push:
    branches:
      - agent/phase-0-5-mobile-ci-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-5-mobile-ci-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact WebKit fallback
        working-directory: architect
        run: node scripts/apply-webkit-page-transition-fallback.mjs
      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No CSS update to commit'
            exit 0
          fi
          git config user.name 'mobile-evidence-bot'
          git config user.email 'mobile-evidence@architect.app'
          git add architect/styles.css
          git commit -m 'fix(mobile): keep active pages visible in WebKit'
          git push origin HEAD:agent/phase-0-5-mobile-ci-evidence
