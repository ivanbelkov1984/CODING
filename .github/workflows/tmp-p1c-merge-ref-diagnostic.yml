name: Temporary P1-C merge-ref diagnostic

on:
  pull_request:
    paths:
      - architect/**
      - .github/workflows/tmp-p1c-merge-ref-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record tested commit
        run: git log -1 --format='TESTED_SHA=%H%nPARENTS=%P'
      - name: Install dependencies
        working-directory: architect
        run: npm install
      - name: Install Chromium
        working-directory: architect
        run: npx playwright install --with-deps chromium
      - name: Capture full merge-ref suite
        id: tests
        working-directory: architect
        shell: bash
        run: |
          mkdir -p test-results/p1c-merge-ref
          set +e
          npm test > test-results/p1c-merge-ref/npm-test.log 2>&1
          status=$?
          cat test-results/p1c-merge-ref/npm-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload merge-ref diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p1c-merge-ref-diagnostic
          path: architect/test-results/p1c-merge-ref/npm-test.log
          retention-days: 1
      - name: Fail if suite failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
