name: Temporary P1-C privacy diagnostic

on:
  push:
    branches:
      - agent/phase-1-privacy-feedback-boundaries
    paths:
      - architect/scripts/apply-p1c-privacy.mjs
      - .github/workflows/tmp-p1c-apply.yml
  pull_request:
    paths:
      - architect/scripts/apply-p1c-privacy.mjs
      - .github/workflows/tmp-p1c-apply.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-privacy-feedback-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact P1-C wiring
        working-directory: architect
        run: node scripts/apply-p1c-privacy.mjs
      - name: Capture focused validation
        id: focused
        working-directory: architect
        shell: bash
        run: |
          mkdir -p test-results/p1c-privacy
          set +e
          {
            node --check privacy-feedback.js
            node --check backend/feedback-privacy.js
            node --check backend/feedback.js
            node --check app.js
            node tests/evidence/privacy_feedback_regression.mjs
            git diff --check
          } > test-results/p1c-privacy/focused.log 2>&1
          status=$?
          cat test-results/p1c-privacy/focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p1c-privacy-focused-diagnostic
          path: architect/test-results/p1c-privacy/focused.log
          retention-days: 1
      - name: Fail when focused validation fails
        if: steps.focused.outputs.status != '0'
        run: exit 1
