name: Temporary P1-C focused commit

on:
  push:
    branches:
      - agent/phase-1-privacy-feedback-boundaries
    paths:
      - architect/scripts/apply-p1c-privacy.mjs
      - .github/workflows/tmp-p1c-apply.yml
  pull_request:
    paths:
      - architect/scripts/apply-p1c-privacy.mjs
      - .github/workflows/tmp-p1c-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-privacy-feedback-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact P1-C wiring
        working-directory: architect
        run: node scripts/apply-p1c-privacy.mjs
      - name: Validate focused privacy boundary
        working-directory: architect
        run: |
          node --check privacy-feedback.js
          node --check backend/feedback-privacy.js
          node --check backend/feedback.js
          node --check app.js
          node tests/evidence/privacy_feedback_regression.mjs
          git diff --check
      - name: Commit focused-validated permanent files
        working-directory: architect
        run: |
          git config user.name 'p1c-privacy-bot'
          git config user.email 'p1c-privacy@architect.app'
          git add privacy-feedback.js backend/feedback-privacy.js backend/feedback.js app.js index.html styles.css build.mjs package.json tests/e2e.mjs tests/mobile-evidence.mjs tests/evidence/privacy_feedback_regression.mjs docs/life-architect-v2/PHASE1_PRIVACY_FEEDBACK_BOUNDARIES.md
          git commit -m 'feat(privacy): enforce feedback consent and minimization'
          git push origin HEAD:agent/phase-1-privacy-feedback-boundaries
