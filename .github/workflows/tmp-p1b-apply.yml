name: Temporary P1-B focused diagnostic

on:
  push:
    branches:
      - agent/phase-1-ai-policy-validators
    paths:
      - architect/tests/evidence/ai_policy_validators_regression.mjs
      - architect/ai-policy.js
      - architect/app.js
      - .github/workflows/tmp-p1b-apply.yml
  pull_request:
    paths:
      - architect/tests/evidence/ai_policy_validators_regression.mjs
      - architect/ai-policy.js
      - architect/app.js
      - .github/workflows/tmp-p1b-apply.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture focused validation
        id: focused
        working-directory: architect
        shell: bash
        run: |
          mkdir -p test-results/p1b-policy
          set +e
          {
            node --check ai-policy.js
            node --check app.js
            node tests/evidence/ai_policy_validators_regression.mjs
            git diff --check
          } > test-results/p1b-policy/focused.log 2>&1
          status=$?
          cat test-results/p1b-policy/focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p1b-policy-focused-diagnostic
          path: architect/test-results/p1b-policy/focused.log
          retention-days: 1
      - name: Fail when focused validation fails
        if: steps.focused.outputs.status != '0'
        run: exit 1
