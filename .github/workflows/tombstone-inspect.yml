name: Temporary tombstone inventory

on:
  push:
    branches:
      - agent/tombstone-namespacing-remediation
  pull_request:
    paths:
      - architect/app.js
      - architect/scripts/inspect-tombstone-calls.mjs
      - .github/workflows/tombstone-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory tomb calls
        working-directory: architect
        run: node scripts/inspect-tombstone-calls.mjs | tee tomb-calls.txt
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: tombstone-call-inventory
          path: architect/tomb-calls.txt
          if-no-files-found: error
