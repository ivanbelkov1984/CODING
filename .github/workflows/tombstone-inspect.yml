name: Temporary remediation source snapshot

on:
  pull_request:
    paths:
      - architect/app.js
      - .github/workflows/tombstone-inspect.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact patched source
        uses: actions/upload-artifact@v4
        with:
          name: remediation-source-snapshot
          path: architect/app.js
          if-no-files-found: error
