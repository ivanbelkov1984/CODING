name: Backup merge debug

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/backup-merge-debug.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm ci
      - run: npm run test:backup
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture npm test after backup suite
        id: test
        shell: bash
        run: |
          set +e
          npm test > backup-merge-debug.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backup-merge-debug-log
          path: architect/backup-merge-debug.log
          if-no-files-found: error
      - name: Keep failure status
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
