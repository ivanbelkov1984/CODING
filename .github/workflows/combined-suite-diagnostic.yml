name: Combined suite diagnostic

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/combined-suite-diagnostic.yml"

jobs:
  combined-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run npm test and capture log
        id: test
        shell: bash
        run: |
          set +e
          npm test > combined-suite.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: combined-suite-test-log
          path: architect/combined-suite.log
          if-no-files-found: error
      - name: Fail after artifact upload
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
