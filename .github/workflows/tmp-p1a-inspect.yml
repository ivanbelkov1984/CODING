name: Temporary P1-A boundary inspection

on:
  push:
    branches:
      - agent/phase-1-additive-schema-metadata
  pull_request:
    paths:
      - architect/app.js
      - architect/scripts/p1a-inspect-boundaries.mjs
      - .github/workflows/tmp-p1a-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect current runtime boundaries
        working-directory: architect
        run: node scripts/p1a-inspect-boundaries.mjs
      - name: Upload boundary report
        uses: actions/upload-artifact@v4
        with:
          name: p1a-boundary-inspection
          path: architect/test-results/p1a-inspect/p1a-boundaries.txt
          retention-days: 1
