name: Temporary P1-C deterministic overlay diagnostic

on:
  push:
    branches:
      - agent/phase-1-privacy-feedback-boundaries
    paths:
      - architect/scripts/fix-p1c-overlay-transitions.mjs
      - .github/workflows/tmp-p1c-overlay-transitions.yml
  pull_request:
    paths:
      - architect/scripts/fix-p1c-overlay-transitions.mjs
      - .github/workflows/tmp-p1c-overlay-transitions.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-1-privacy-feedback-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remove overlay and sheet transitions
        working-directory: architect
        run: node scripts/fix-p1c-overlay-transitions.mjs
      - name: Install dependencies
        working-directory: architect
        run: npm install
      - name: Install Chromium
        working-directory: architect
        run: npx playwright install --with-deps chromium
      - name: Capture focused and full web suite
        id: tests
        working-directory: architect
        shell: bash
        run: |
          mkdir -p test-results/p1c-overlay
          set +e
          {
            node tests/evidence/privacy_feedback_regression.mjs
            npm test
            git diff --check
          } > test-results/p1c-overlay/tests.log 2>&1
          status=$?
          cat test-results/p1c-overlay/tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload overlay diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p1c-overlay-diagnostic
          path: architect/test-results/p1c-overlay/tests.log
          retention-days: 1
      - name: Commit deterministic overlays after validation
        if: steps.tests.outputs.status == '0'
        working-directory: architect
        run: |
          git config user.name 'p1c-privacy-bot'
          git config user.email 'p1c-privacy@architect.app'
          git add styles.css
          git commit -m 'fix(mobile): remove modal transition race'
          git push origin HEAD:agent/phase-1-privacy-feedback-boundaries
      - name: Fail if validation failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
