name: Temporary P1-B AI inventory

on:
  push:
    branches:
      - agent/phase-1-ai-policy-validators
  pull_request:
    paths:
      - architect/app.js
      - architect/scripts/p1b-ai-inventory.mjs
      - .github/workflows/tmp-p1b-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inventory AI boundaries
        working-directory: architect
        run: node scripts/p1b-ai-inventory.mjs
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: p1b-ai-inventory
          path: architect/test-results/p1b-inventory/p1b-ai-inventory.txt
          retention-days: 1
