name: Temporary tombstone E2E expectation update

on:
  push:
    branches:
      - agent/tombstone-namespacing-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tombstone-namespacing-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact E2E assertion update
        working-directory: architect
        run: node scripts/update-tombstone-e2e-expectation.mjs
      - name: Validate and commit
        run: |
          node --check architect/tests/e2e.mjs
          git diff --check
          if git diff --quiet; then
            echo 'No E2E change to commit'
            exit 0
          fi
          git config user.name 'remediation-bot'
          git config user.email 'remediation@architect.app'
          git add architect/tests/e2e.mjs
          git commit -m 'test(data): expect namespaced digest tombstone'
          git push origin HEAD:agent/tombstone-namespacing-remediation
