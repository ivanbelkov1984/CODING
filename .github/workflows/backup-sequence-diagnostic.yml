name: Backup sequence diagnostic

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/backup-sequence-diagnostic.yml"

jobs:
  sequence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm ci
      - name: Run backup tests
        run: npm run test:backup
      - run: npx playwright install --with-deps chromium webkit
      - name: Run npm test and capture log
        id: test
        shell: bash
        run: |
          set +e
          npm test > backup-sequence.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backup-sequence-test-log
          path: architect/backup-sequence.log
          if-no-files-found: error
      - name: Fail after artifact upload
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
