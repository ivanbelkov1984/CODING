name: Backup sequence diagnostic

on:
  pull_request:
    paths:
      - "architect/**"
      - ".github/workflows/backup-sequence-diagnostic.yml"

jobs:
  sequence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: architect/package-lock.json
      - run: npm ci
      - name: Run backup tests
        run: npm run test:backup
      - run: npx playwright install --with-deps chromium webkit
      - name: Run npm test and capture log
        id: test
        shell: bash
        run: |
          set +e
          npm test > backup-sequence.log 2>&1
          code=$?
          node --input-type=module >> backup-sequence.log 2>&1 <<'NODE'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'url';
          import { join } from 'path';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await page.goto(pathToFileURL(join(process.cwd(), 'dist', 'app.html')).href);
          await page.waitForSelector('#nsh-context-dock', { state: 'attached' });
          await page.evaluate(() => {
            const splash = document.getElementById('splash');
            if (splash) splash.style.display = 'none';
            document.querySelectorAll('.ov.on').forEach(element => element.classList.remove('on'));
            localStorage.setItem('arch_nav_v2', '1');
            applyNavShell();
          });
          console.log('\nGEOMETRY DIAGNOSTIC');
          for (const [width, height, name] of [[375, 667, 'iPhone SE'], [430, 932, 'iPhone Pro Max']]) {
            await page.setViewportSize({ width, height });
            const result = await page.evaluate(() => {
              goTo('health');
              window.__ARCH_CONTEXT_DOCK__.update();
              const dock = document.getElementById('nsh-context-dock');
              const d = dock.getBoundingClientRect();
              const t = document.getElementById('nsh-tabbar').getBoundingClientRect();
              const content = document.querySelector('.content');
              return {
                hidden: dock.hidden,
                bodyClass: document.body.className,
                viewport: [innerWidth, innerHeight],
                dock: { left:d.left, right:d.right, top:d.top, bottom:d.bottom, width:d.width, height:d.height },
                tabbar: { top:t.top, bottom:t.bottom, height:t.height },
                paddingBottom: getComputedStyle(content).paddingBottom,
                overflowWidth: dock.scrollWidth,
              };
            });
            console.log(name, JSON.stringify(result));
          }
          await browser.close();
          NODE
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: backup-sequence-test-log
          path: architect/backup-sequence.log
          if-no-files-found: error
      - name: Fail after artifact upload
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
